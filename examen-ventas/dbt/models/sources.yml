version: 2
sources:
  - name: ventas_raw
    schema: raw
    tables:
      - name: ventas
        # Actualidad de la carga: se mide con _loaded_at (cuándo llegó la fila a raw),
        # no con fecha_venta. Hasta 12 h es normal, más de 12 h advierte y más de 24 h falla.
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 12, period: hour}
          error_after: {count: 24, period: hour}
        columns:
          - name: id_venta
            tests: [unique, not_null]
          - name: fecha_venta
            tests: [not_null]
          - name: cantidad
            tests: [not_null]
          - name: precio_unitario
            tests: [not_null]
          - name: _loaded_at
            tests: [not_null]
